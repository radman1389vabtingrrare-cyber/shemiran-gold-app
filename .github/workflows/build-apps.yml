# ساخت برنامه‌ها روی ماشین‌های گیت‌هاب: اندروید (APK)، ویندوز (نصب‌کننده‌ی NSIS) و iOS (روی لینوکس ساخت iOS ممکن نیست).
# اندروید: سکرت‌های ANDROID_KEYSTORE_BASE64 / ANDROID_KS_PASS (کلید امضای ثابت؛ بدون آن APK با کلید موقت امضا می‌شود و قابل به‌روزرسانی نیست)
# ساخت دستی: Actions ← build-apps ← Run workflow
# بدون سکرت‌ها: یک IPA «بدون امضا» می‌سازد (برای آزمایش با AltStore/Sideloadly).
# با سکرت‌های زیر: IPA امضاشده (Ad Hoc یا Enterprise) می‌سازد که از سایت با itms-services نصب می‌شود.
#   IOS_CERT_P12_BASE64 / IOS_CERT_PASSWORD  — گواهی توزیع (p12)
#   IOS_PROFILE_BASE64                        — پروفایل provisioning (mobileprovision)
#   IOS_TEAM_ID, IOS_PROFILE_NAME             — شناسه‌ی تیم و نام پروفایل
#   IOS_EXPORT_METHOD                         — ad-hoc | enterprise | app-store-connect
name: build-apps
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci || npm install
      - run: node ../scripts/sync-shared.mjs && npx cap sync android
      - run: cd android && ./gradlew --no-daemon assembleRelease
      - name: امضا
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ks.keystore; PASS="${{ secrets.ANDROID_KS_PASS }}"
          else
            PASS=temporary-key; keytool -genkeypair -keystore ks.keystore -alias shemirangold -keyalg RSA -keysize 4096 -validity 10000 -storepass $PASS -keypass $PASS -dname "CN=Shemiran Gold" >/dev/null
          fi
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.keystore --ks-key-alias shemirangold --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out shemiran-gold.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: shemiran-gold-android, path: mobile/shemiran-gold.apk }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: node ../scripts/sync-shared.mjs
      # روی ویندوز wine لازم نیست: نصب‌کننده‌ی واقعی (NSIS)
      - run: npx electron-builder --win nsis --x64 --config.win.signAndEditExecutable=true --config.win.target=nsis --config.win.artifactName=shemiran-gold-setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: shemiran-gold-windows, path: dist/desktop/shemiran-gold-setup.exe }

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    env:
      SIGNED: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: node ../scripts/sync-shared.mjs && npx cap sync ios
      - name: امضا (اختیاری)
        if: env.SIGNED == 'true'
        run: |
          echo "${{ secrets.IOS_CERT_P12_BASE64 }}" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain && security default-keychain -s build.keychain && security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.IOS_CERT_PASSWORD }}" -T /usr/bin/codesign && security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          cat > ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>${{ secrets.IOS_EXPORT_METHOD }}</string><key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
          <key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>ir.shemirangold.app</key><string>${{ secrets.IOS_PROFILE_NAME }}</string></dict></dict></plist>
          PL
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROFILE_NAME }}"
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
          mv build/ipa/*.ipa build/shemiran-gold.ipa
      - name: IPA بدون امضا
        if: env.SIGNED != 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p build/Payload && cp -R build/dd/Build/Products/Release-iphoneos/App.app build/Payload/
          (cd build && zip -qry shemiran-gold.ipa Payload)
      - uses: actions/upload-artifact@v4
        with: { name: shemiran-gold-ios, path: mobile/build/shemiran-gold.ipa }
